<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="xogame.css">
</head>
<body>
    <h1>Tic Tac Toe</h1>
    <button class="reset">Reset Game</button>
    <table>
        <tr>
            <th colspan="2">ScoreBoard</th>
        </tr>
        <tr>
            <td><input type="text" placeholder="Enter Player 1 Name" class="playerOneNameInput"></td>
            <td><input type="text" placeholder="Enter Player 2 Name" class="playerTwoNameInput"></td>
        </tr>
        <tr>
            <td><span class="playerOneName"></span>: <span class="playerOneScore">0</span></td>
            <td><span class="playerTwoName"></span>: <span class="playerTwoScore">0</span></td>
        </tr>
    </table>
    <p>Alert: <span class="announcement"></span></p>
    <div class="board">
    </div>
    <dialog class="dialog">
        <p class="dialogText"></p>
        <button class="dialogCloseButton">New Game?</button>
    </dialog>
    <script src="./xogame.js"></script>
</body>
</html>
